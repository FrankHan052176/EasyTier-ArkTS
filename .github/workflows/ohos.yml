name: ohos

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [core-har-published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ohos:
    name: ohos
    runs-on: ubuntu-latest
    env:
      CORE_HAR_PACKAGE: ${{ github.event.client_payload.package_name || 'easytier-ohrs' }}
      SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/AppGallerySigning' }}
      SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || 'main' }}
      OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280

    steps:
      - name: Checkout ArkTS app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up HarmonyOS Command Line Tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Install dependencies
        id: core_har
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
          CORE_HAR_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.ohpm/.ohpmrc"' EXIT

          ohpm uninstall "$CORE_HAR_PACKAGE"

          mkdir -p "$HOME/.ohpm"
          umask 077
          printf '%s' "$CODEARTS_PRIVATE_OHPM_READ" > "$HOME/.ohpm/.ohpmrc"
          ohpm install "$CORE_HAR_PACKAGE@latest" \
            --registry "$CORE_HAR_REGISTRY"
          ohpm install

          resolved_version=$(jq -r '.version' \
            "oh_modules/$CORE_HAR_PACKAGE/oh-package.json5")
          package_branch=$(printf '%s\n' "$resolved_version" | sed -E \
            's/^[0-9]+\.[0-9]+\.[0-9]+-//; s/-[0-9]+-[0-9]+-[0-9]+-g[0-9a-f]+$//')
          echo "Installed Core HAR: $CORE_HAR_PACKAGE@$resolved_version"
          echo "package_branch=$package_branch" >> "$GITHUB_OUTPUT"
          echo "package_version=$resolved_version" >> "$GITHUB_OUTPUT"

      - name: Prepare EasyTier signing configuration
        env:
          GH_TOKEN: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
          SIGNING_REPOSITORY_DIR: ${{ runner.temp }}/signing-repository
          SIGNING_APP_DIR: EasyTier
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/easytier-signing
        run: |
          set -euo pipefail
          gh repo clone \
            "$SIGNING_REPOSITORY" \
            "$SIGNING_REPOSITORY_DIR" \
            -- \
            --depth=1 \
            --branch "$SIGNING_REPOSITORY_REF"
          .github/scripts/prepare-signing-config.sh
          echo "EASYTIER_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Build signed publish release App
        id: app
        env:
          CORE_HAR_BRANCH: ${{ steps.core_har.outputs.package_branch }}
          CORE_HAR_VERSION: ${{ steps.core_har.outputs.package_version }}
        run: |
          set -euo pipefail
          hvigorw assembleApp \
            -p product=publish \
            -p buildMode=release \
            --no-daemon

          signed_app=$(find build/outputs/publish \
            -type f -name '*-signed.app' -print -quit)
          test -n "$signed_app"
          app_name="EasyTier-${CORE_HAR_BRANCH}-${CORE_HAR_VERSION}"
          app_path="$RUNNER_TEMP/$app_name.app"
          mv "$signed_app" "$app_path"
          echo "name=$app_name" >> "$GITHUB_OUTPUT"
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed App
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}
          path: ${{ steps.app.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      # TODO(AGC): Upload the signed App after AGC credentials are configured.
      # TODO(AGC): Publish the uploaded App to the AGC test track.

      - name: Remove credentials and signing material
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/signing-repository" \
            "$RUNNER_TEMP/easytier-signing"
          rm -f "$HOME/.ohpm/.ohpmrc"
