name: ohos

on:
  push:
    branches: [main]
  release:
    types: [published]
  repository_dispatch:
    types: [core-har-published]
  workflow_dispatch:
    inputs:
      notify:
        description: '是否发送测试邀请通知 (勾选发送通知，默认不勾选为静默发布)'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  ohos:
    name: ohos
    runs-on: ubuntu-latest
    env:
      CORE_HAR_PACKAGE: ${{ github.event.client_payload.package_name || 'easytier-ohrs' }}
      SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/AppGallerySigning' }}
      SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || 'main' }}
      OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
      AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
      AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
      AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
      AGC_API_DOMAIN: ${{ vars.AGC_API_DOMAIN || 'connect-api.cloud.huawei.com' }}
      AGC_TEST_DURATION_DAYS: ${{ vars.AGC_TEST_DURATION_DAYS || '14' }}

    steps:
      - name: Checkout ArkTS app
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Resolve release channel
        id: channel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at || '' }}
        run: |
          set -euo pipefail
          channel=development
          submit_agc_version=1
          release_date=
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            channel=stable
            submit_agc_version=0
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Published release tag must look like vX.Y.Z.N: $RELEASE_TAG" >&2
              exit 1
            fi
            release_date="${RELEASE_PUBLISHED_AT%%T*}"
            if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Published release date is invalid: $RELEASE_PUBLISHED_AT" >&2
              exit 1
            fi
          fi
          echo "EASYTIER_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "EASYTIER_RELEASE_DATE=$release_date" >> "$GITHUB_ENV"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "submit_agc_version=$submit_agc_version" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Build channel: $channel; AGC version submit: $submit_agc_version"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up HarmonyOS Command Line Tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Install dependencies
        id: core_har
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
          CORE_HAR_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
          GH_TOKEN: ${{ github.token }}
          BUILD_CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_TAG: ${{ steps.channel.outputs.release_tag }}
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.ohpm/.ohpmrc"' EXIT

          ohpm uninstall "$CORE_HAR_PACKAGE"

          mkdir -p "$HOME/.ohpm"
          umask 077
          printf '%s' "$CODEARTS_PRIVATE_OHPM_READ" > "$HOME/.ohpm/.ohpmrc"
          ohpm install "$CORE_HAR_PACKAGE@latest" \
            --registry "$CORE_HAR_REGISTRY"
          ohpm install

          resolved_version=$(jq -r '.version' \
            "oh_modules/$CORE_HAR_PACKAGE/oh-package.json5")
          if [[ "$resolved_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-.+-([0-9]+)-[0-9]+-[0-9]+-g[0-9a-f]+$ ]]; then
            core_version="${BASH_REMATCH[1]}"
            core_commit_count="${BASH_REMATCH[2]}"
          else
            echo "Unsupported Core HAR version: $resolved_version" >&2
            exit 1
          fi

          today=$(date -u +%F)
          day_of_year=$(date -u +%j)
          workflow_runs=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ohos.yml/runs?per_page=100")
          first_run_number=$(jq -er --arg today "$today" \
            '[.workflow_runs[] | select(.created_at | startswith($today)) | .run_number] | min' \
            <<<"$workflow_runs")
          build_number=$((10#$GITHUB_RUN_NUMBER - 10#$first_run_number + 1))
          if (( build_number < 1 || build_number > 99 )); then
            echo "Daily build number is outside the supported range: $build_number" >&2
            exit 1
          fi

          app_version_name="${core_version}.${core_commit_count}"
          app_version_code="${core_version//./}${day_of_year}$(printf '%02d' "$build_number")"
          app_version_code=$((10#$app_version_code))
          if [[ "$BUILD_CHANNEL" == "stable" && "$RELEASE_TAG" != "v${app_version_name}" ]]; then
            echo "Release tag must match computed App version: expected v${app_version_name}, got $RELEASE_TAG" >&2
            exit 1
          fi
          app_json=$(mktemp)
          jq --arg version_name "$app_version_name" --argjson version_code "$app_version_code" \
            '.app.versionName = $version_name | .app.versionCode = $version_code' \
            AppScope/app.json5 > "$app_json"
          mv "$app_json" AppScope/app.json5

          package_branch=$(printf '%s\n' "$resolved_version" | sed -E \
            's/^[0-9]+\.[0-9]+\.[0-9]+-//; s/-[0-9]+-[0-9]+-[0-9]+-g[0-9a-f]+$//')
          echo "Installed Core HAR: $CORE_HAR_PACKAGE@$resolved_version"
          echo "App version: $app_version_name ($app_version_code), build number: $build_number"
          echo "package_branch=$package_branch" >> "$GITHUB_OUTPUT"
          echo "package_version=$resolved_version" >> "$GITHUB_OUTPUT"
          echo "app_version_name=$app_version_name" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$app_version_code" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Prepare EasyTier signing configuration
        env:
          GH_TOKEN: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
          SIGNING_REPOSITORY_DIR: ${{ runner.temp }}/signing-repository
          SIGNING_APP_DIR: EasyTier
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/easytier-signing
        run: |
          set -euo pipefail
          gh repo clone \
            "$SIGNING_REPOSITORY" \
            "$SIGNING_REPOSITORY_DIR" \
            -- \
            --depth=1 \
            --branch "$SIGNING_REPOSITORY_REF"
          .github/scripts/prepare-signing-config.sh
          echo "EASYTIER_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Build signed publish release App
        id: app
        env:
          CORE_HAR_BRANCH: ${{ steps.core_har.outputs.package_branch }}
          CORE_HAR_VERSION: ${{ steps.core_har.outputs.package_version }}
          EASYTIER_RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
          EASYTIER_RELEASE_DATE: ${{ steps.channel.outputs.release_date }}
        run: |
          set -euo pipefail
          npm config set registry=https://registry.npmjs.org/ --location=user
          hvigorw assembleApp \
            -p product=publish \
            -p buildMode=release \
            --no-daemon

          signed_app=$(find build/outputs/publish \
            -type f -name '*-signed.app' -print -quit)
          test -n "$signed_app"
          app_name="EasyTier-${{ steps.core_har.outputs.app_version_name }}-${{ steps.channel.outputs.channel }}"
          app_path="$RUNNER_TEMP/$app_name.app"
          mv "$signed_app" "$app_path"
          echo "name=$app_name" >> "$GITHUB_OUTPUT"
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed App
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}
          path: ${{ steps.app.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Validate AGC credentials for stable upload
        if: ${{ steps.channel.outputs.channel == 'stable' }}
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$AGC_CLIENT_ID" && test -n "$AGC_CLIENT_SECRET" && test -n "$AGC_APP_ID"

      - name: Upload package to AGC
        if: ${{ env.AGC_CLIENT_ID != '' && env.AGC_CLIENT_SECRET != '' && env.AGC_APP_ID != '' }}
        id: agc
        env:
          AGC_APP_FILE: ${{ steps.app.outputs.path }}
          AGC_EVENT_NAME: ${{ github.event_name }}
          AGC_RUN_ATTEMPT: ${{ github.run_attempt }}
          # Push to main on first attempt notifies testers by default.
          # workflow_dispatch uses the explicit notify input (default false).
          # repository_dispatch defaults to silent (notify=false) unless specified in client_payload.
          AGC_NEED_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && (inputs.notify && '1' || '0') || (github.event_name == 'repository_dispatch' && (github.event.client_payload.notify && '1' || '0') || (github.event_name == 'push' && github.run_attempt == 1 && '1' || '0')) }}
          AGC_SUBMIT_VERSION: ${{ steps.channel.outputs.submit_agc_version }}
          AGC_APP_NAME_PREFIX: EasyTier
          AGC_CORE_HAR_VERSION: ${{ steps.core_har.outputs.package_version }}
          AGC_PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AGC_WORKFLOW_SHA: ${{ github.sha }}
        run: .github/scripts/agc-test-release.sh "$AGC_APP_FILE"

      - name: Remove credentials and signing material
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/signing-repository" \
            "$RUNNER_TEMP/easytier-signing"
          rm -f "$HOME/.npmrc"
          rm -f "$HOME/.ohpm/.ohpmrc"
