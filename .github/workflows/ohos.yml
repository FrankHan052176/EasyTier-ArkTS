name: ohos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ohos-check:
    name: ohos-unsigned-check
    runs-on: ubuntu-latest
    env:
      OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280

    steps:
      - name: Checkout ArkTS app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up HarmonyOS Command Line Tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          ohpm install --all

      - name: Verify unsigned Release HAP and App compilation
        run: |
          set -euo pipefail
          npm config set registry=https://registry.npmjs.org/ --location=user
          hvigorw assembleHap \
            --no-daemon \
            -p buildMode=release \
            -p enableSignTask=false
          hvigorw assembleApp \
            --no-daemon \
            -p product=publish \
            -p buildMode=release \
            -p enableSignTask=false

          unsigned_hap=$(find entry/build -type f -name '*-unsigned.hap' -print -quit)
          unsigned_app=$(find build/outputs/publish -type f -name '*-unsigned.app' -print -quit)
          test -n "$unsigned_hap"
          test -n "$unsigned_app"
          echo "Verified unsigned artifacts locally (not uploaded): $unsigned_hap, $unsigned_app"
