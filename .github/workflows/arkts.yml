name: ArkTS

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [core-har-published]
  workflow_dispatch:
    inputs:
      package_name:
        description: Private OHPM package name for the Core branch
        required: true
        default: easytier-main
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.package_name || inputs.package_name || 'easytier-main' }}
  cancel-in-progress: true

jobs:
  publish-app:
    name: Signed publish release App
    if: >-
      github.event_name != 'repository_dispatch' ||
      (
        github.event.client_payload.core_repository == 'EasyTier/EasyTier' &&
        github.event.client_payload.package_name != ''
      )
    runs-on: ubuntu-latest
    env:
      CORE_HAR_PACKAGE: ${{ github.event.client_payload.package_name || inputs.package_name || 'easytier-main' }}
      CORE_HAR_TAG: arkts-latest
      SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/AppGallerySigning' }}
      SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || 'main' }}
      OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280

    steps:
      - name: Checkout ArkTS app
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate signing configuration
        run: |
          set -euo pipefail
          test -n "$SIGNING_REPOSITORY"
          test -n "$SIGNING_REPOSITORY_REF"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up HarmonyOS Command Line Tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Verify HarmonyOS tools
        run: |
          set -euo pipefail
          test -d "$OHOS_NDK_HOME"
          ohpm --version
          hvigorw --version
          node --version
          java -version

      - name: Install Core HAR from private moving tag
        id: core_har
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
          CORE_HAR_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.ohpm/.ohpmrc"' EXIT
          test -n "$CODEARTS_PRIVATE_OHPM_READ"
          mkdir -p "$HOME/.ohpm"
          umask 077
          printf '%s' "$CODEARTS_PRIVATE_OHPM_READ" > "$HOME/.ohpm/.ohpmrc"
          chmod 600 "$HOME/.ohpm/.ohpmrc"

          # Install Core in an isolated OHPM project. The private-registry
          # command therefore cannot see or resolve any application dependency.
          core_project="$RUNNER_TEMP/easytier-core-ohpm"
          rm -rf "$core_project"
          mkdir -p "$core_project"
          jq -n '{
            modelVersion: "6.0.0",
            description: "Isolated EasyTier Core dependency",
            dependencies: {},
            devDependencies: {},
            dynamicDependencies: {}
          }' > "$core_project/oh-package.json5"

          core_har_spec="${CORE_HAR_PACKAGE}@tag:${CORE_HAR_TAG}"
          printf 'Core HAR spec: %s\n' "$core_har_spec"
          (
            cd "$core_project"
            ohpm install "$core_har_spec" \
              --registry "$CORE_HAR_REGISTRY" \
              --strict_ssl false \
              --retry_times 5 \
              --retry_interval 3000
          )

          installed_package=$(
            cd "$core_project/oh_modules/$CORE_HAR_PACKAGE" && pwd -P
          )
          echo "package_spec=$core_har_spec" >> "$GITHUB_OUTPUT"

          # The app consumes the already-installed package as a local directory.
          # Its following plain `ohpm install` therefore needs no private access.
          local_core_spec="file:$installed_package"
          jq \
            --arg name "$CORE_HAR_PACKAGE" \
            --arg spec "$local_core_spec" \
            '.dependencies = (
              (.dependencies // {} | del(.["easytier-ohrs"])) +
              {($name): $spec}
            )' \
            oh-package.json5 > "$RUNNER_TEMP/oh-package.with-core.json5"
          mv "$RUNNER_TEMP/oh-package.with-core.json5" oh-package.json5
          rm -rf oh_modules
          rm -f oh-package-lock.json5

          # OHPM has no package-alias syntax. The published package name follows
          # the Core branch, so adapt only the runner checkout's static imports.
          while IFS= read -r source_file; do
            perl -pi -e \
              "s/from 'easytier-ohrs'/from '$CORE_HAR_PACKAGE'/g; s/from \"easytier-ohrs\"/from \"$CORE_HAR_PACKAGE\"/g" \
              "$source_file"
          done < <(
            rg -l "from ['\"]easytier-ohrs['\"]" entry \
              --glob '*.ets' \
              --glob '*.ts'
          )

      - name: Install remaining ArkTS dependencies
        run: ohpm install

      - name: Checkout private signing repository
        env:
          GH_TOKEN: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          rm -rf "$RUNNER_TEMP/signing-repository"
          gh repo clone \
            "$SIGNING_REPOSITORY" \
            "$RUNNER_TEMP/signing-repository" \
            -- \
            --depth=1 \
            --branch "$SIGNING_REPOSITORY_REF"

      - name: Prepare EasyTier signing configuration
        env:
          SIGNING_REPOSITORY_DIR: ${{ runner.temp }}/signing-repository
          SIGNING_APP_DIR: EasyTier
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/easytier-signing
        run: |
          set -euo pipefail
          .github/scripts/prepare-signing-config.sh
          echo "EASYTIER_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Confirm App build task
        run: hvigorw tasks

      - name: Build signed publish release App
        run: >-
          hvigorw assembleApp
          -p product=publish
          -p buildMode=release
          --no-daemon
          --no-incremental

      - name: Verify signed App
        id: app_artifact
        run: |
          set -euo pipefail
          mapfile -t signed_apps < <(
            find build/outputs/publish -maxdepth 1 -type f -name '*-signed.app' -print
          )
          test "${#signed_apps[@]}" -eq 1
          signed_app="${signed_apps[0]}"
          test -s "$signed_app"

          verify_dir=$(mktemp -d "$RUNNER_TEMP/easytier-app-verify.XXXXXX")
          java -jar "$OHOS_NDK_HOME/toolchains/lib/hap-sign-tool.jar" verify-app \
            -inFile "$signed_app" \
            -outCertChain "$verify_dir/cert-chain.cer" \
            -outProfile "$verify_dir/profile.p7b" \
            -inForm zip
          rm -rf "$verify_dir"
          echo "path=$signed_app" >> "$GITHUB_OUTPUT"

      - name: Record build provenance
        run: |
          {
            echo "### EasyTier ArkTS publish App"
            echo
            echo "- Core request: \`${{ steps.core_har.outputs.package_spec }}\`"
            echo "- Core selection: private registry moving tag \`arkts-latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed App
        uses: actions/upload-artifact@v4
        with:
          name: easytier-arkts-${{ github.run_id }}-signed-app
          path: ${{ steps.app_artifact.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      # TODO(AGC): Enable after AGC credentials and upload parameters are ready.
      - name: Upload signed App to AGC (placeholder)
        if: ${{ vars.ENABLE_AGC_SIGNED_APP_UPLOAD == 'true' }}
        run: |
          echo "::error::Implement the AGC signed App upload before enabling this step."
          exit 1

      # TODO(AGC): Enable only after the AGC upload step returns a release ID.
      - name: Publish AGC test release (placeholder)
        if: ${{ vars.ENABLE_AGC_TEST_RELEASE == 'true' }}
        run: |
          echo "::error::Implement the AGC test release before enabling this step."
          exit 1

      - name: Remove credentials and signing material
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/signing-repository" \
            "$RUNNER_TEMP/easytier-signing" \
            "$RUNNER_TEMP/easytier-core-ohpm"
          rm -f "$HOME/.ohpm/.ohpmrc"
